! ISP - simulated Internet. Gi0/0=HQ, Gi0/1=BR1, Gi0/2=BR2, Gi0/3=BR3
hostname ISP
no ip domain-lookup
!
interface GigabitEthernet0/0
 description To HQ-Edge
 ip address 203.0.113.1 255.255.255.252
 no shutdown
interface GigabitEthernet0/1
 description To BR1
 ip address 198.51.100.1 255.255.255.252
 no shutdown
interface GigabitEthernet0/2
 description To BR2
 ip address 198.51.100.5 255.255.255.252
 no shutdown
interface GigabitEthernet0/3
 description To BR3
 ip address 198.51.100.9 255.255.255.252
 no shutdown
!
! All site WAN subnets are directly connected - no routing protocol needed.
! No routes to private (10.x / 172.16.x) space exist here, as on the real Internet.
end
