! Branch access switch (use for BR1/BR2/BR3 - change hostname only)
! Gi0/0 = trunk to branch router Gi0/1, Gi1/0-1/2 = test hosts
hostname BR-SW
no ip domain-lookup
!
vlan 10
 name FINANCE
vlan 30
 name SALES
vlan 40
 name GUEST
vlan 999
 name NATIVE-UNUSED
!
spanning-tree mode rapid-pvst
spanning-tree portfast bpduguard default
!
interface GigabitEthernet0/0
 description Trunk to branch router
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,30,40
!
interface GigabitEthernet1/0
 description Finance host
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
interface GigabitEthernet1/1
 description Sales host
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
interface GigabitEthernet1/2
 description Guest host
 switchport mode access
 switchport access vlan 40
 spanning-tree portfast
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
end
