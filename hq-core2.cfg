! HQ-Core2 (IOSv-L2) - HSRP ACTIVE for VLAN 30, 40, 99; STANDBY for 10, 20
! Gi0/0 = trunk to HQ-Access, Gi0/1 = trunk to Core1, Gi0/2 = routed to HQ-Edge
hostname HQ-Core2
no ip domain-lookup
service password-encryption
enable secret Str0ng-Enable!
ip routing
!
vlan 10
 name FINANCE
vlan 20
 name IT
vlan 30
 name SALES
vlan 40
 name GUEST
vlan 99
 name MGMT
vlan 999
 name NATIVE-UNUSED
!
interface Loopback0
 ip address 3.3.3.3 255.255.255.255
!
interface GigabitEthernet0/0
 description Trunk to HQ-Access
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,99
interface GigabitEthernet0/1
 description Trunk to HQ-Core1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,99
interface GigabitEthernet0/2
 description Routed uplink to HQ-Edge
 no switchport
 ip address 10.255.0.6 255.255.255.252
 ip ospf network point-to-point
 no shutdown
!
track 1 interface GigabitEthernet0/2 line-protocol
!
ip access-list extended FINANCE-OUT
 remark Only Finance + IT may reach Finance
 permit ip 10.0.20.0 0.0.0.255 10.0.10.0 0.0.0.255
 permit ip 10.0.10.0 0.0.0.255 10.0.10.0 0.0.0.255
 permit ip 10.1.10.0 0.0.0.255 10.0.10.0 0.0.0.255
 permit ip 10.2.10.0 0.0.0.255 10.0.10.0 0.0.0.255
 permit ip 10.3.10.0 0.0.0.255 10.0.10.0 0.0.0.255
 permit tcp any any established
 permit icmp any any echo-reply
 permit ospf any any
 deny   ip any any log
ip access-list extended GUEST-IN
 remark Guests: Internet only, no internal RFC1918 access
 deny   ip 10.0.40.0 0.0.0.255 10.0.0.0 0.255.255.255
 deny   ip 10.0.40.0 0.0.0.255 172.16.0.0 0.15.255.255
 deny   ip 10.0.40.0 0.0.0.255 192.168.0.0 0.0.255.255
 permit ip 10.0.40.0 0.0.0.255 any
access-list 10 permit 10.0.99.0 0.0.0.255
!
interface Vlan10
 description FINANCE
 ip address 10.0.10.3 255.255.255.0
 ip access-group FINANCE-OUT out
 standby version 2
 standby 10 ip 10.0.10.1
 standby 10 priority 100
 standby 10 preempt
 standby 10 track 1 decrement 20
interface Vlan20
 description IT
 ip address 10.0.20.3 255.255.255.0
 standby version 2
 standby 20 ip 10.0.20.1
 standby 20 priority 100
 standby 20 preempt
 standby 20 track 1 decrement 20
interface Vlan30
 description SALES
 ip address 10.0.30.3 255.255.255.0
 standby version 2
 standby 30 ip 10.0.30.1
 standby 30 priority 110
 standby 30 preempt
 standby 30 track 1 decrement 20
interface Vlan40
 description GUEST
 ip address 10.0.40.3 255.255.255.0
 ip access-group GUEST-IN in
 standby version 2
 standby 40 ip 10.0.40.1
 standby 40 priority 110
 standby 40 preempt
 standby 40 track 1 decrement 20
interface Vlan99
 description MGMT
 ip address 10.0.99.3 255.255.255.0
 standby version 2
 standby 99 ip 10.0.99.1
 standby 99 priority 110
 standby 99 preempt
 standby 99 track 1 decrement 20
!
router ospf 1
 router-id 3.3.3.3
 network 3.3.3.3 0.0.0.0 area 0
 network 10.255.0.4 0.0.0.3 area 0
 network 10.0.0.0 0.0.255.255 area 0
 passive-interface default
 no passive-interface GigabitEthernet0/2
!
username admin secret Str0ng-Admin!
line vty 0 4
 access-class 10 in
 login local
 transport input ssh
end
