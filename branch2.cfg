! BR2 - Branch 2 router (Area 2). Gi0/0 = ISP, Gi0/1 = branch switch (trunk)
hostname BR2
no ip domain-lookup
service password-encryption
enable secret Str0ng-Enable!
!
interface Loopback0
 ip address 12.12.12.12 255.255.255.255
!
interface GigabitEthernet0/0
 description To ISP
 ip address 198.51.100.6 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 no ip address
 no shutdown
interface GigabitEthernet0/1.10
 description FINANCE
 encapsulation dot1Q 10
 ip address 10.2.10.1 255.255.255.0
 ip access-group FINANCE-OUT out
interface GigabitEthernet0/1.30
 description SALES
 encapsulation dot1Q 30
 ip address 10.2.30.1 255.255.255.0
interface GigabitEthernet0/1.40
 description GUEST
 encapsulation dot1Q 40
 ip address 10.2.40.1 255.255.255.0
 ip access-group GUEST-IN in
interface GigabitEthernet0/1.999
 encapsulation dot1Q 999 native
!
crypto isakmp policy 10
 encryption aes 256
 hash sha256
 authentication pre-share
 group 14
 lifetime 86400
crypto isakmp key VPN-Key-BR2 address 203.0.113.2
crypto ipsec transform-set TS-AES256 esp-aes 256 esp-sha256-hmac
 mode transport
crypto ipsec profile GRE-PROF
 set transform-set TS-AES256
interface Tunnel1
 description VPN to HQ
 ip address 172.16.2.2 255.255.255.252
 tunnel source GigabitEthernet0/0
 tunnel destination 203.0.113.2
 tunnel protection ipsec profile GRE-PROF
 ip ospf network point-to-point
!
router ospf 1
 router-id 12.12.12.12
 network 12.12.12.12 0.0.0.0 area 2
 network 172.16.2.0 0.0.0.3 area 2
 network 10.2.0.0 0.0.255.255 area 2
 passive-interface default
 no passive-interface Tunnel1
!
ip route 0.0.0.0 0.0.0.0 198.51.100.5
!
ip access-list extended FINANCE-OUT
 permit ip 10.0.20.0 0.0.0.255 10.2.10.0 0.0.0.255
 permit ip 10.0.10.0 0.0.0.255 10.2.10.0 0.0.0.255
 permit ip 10.1.10.0 0.0.0.255 10.2.10.0 0.0.0.255
 permit ip 10.3.10.0 0.0.0.255 10.2.10.0 0.0.0.255
 permit tcp any any established
 permit icmp any any echo-reply
 deny   ip any any log
ip access-list extended GUEST-IN
 deny   ip 10.2.40.0 0.0.0.255 10.0.0.0 0.255.255.255
 deny   ip 10.2.40.0 0.0.0.255 172.16.0.0 0.15.255.255
 deny   ip 10.2.40.0 0.0.0.255 192.168.0.0 0.0.255.255
 permit ip 10.2.40.0 0.0.0.255 any
access-list 10 permit 10.0.99.0 0.0.0.255
username admin secret Str0ng-Admin!
line vty 0 4
 access-class 10 in
 login local
 transport input ssh
end
