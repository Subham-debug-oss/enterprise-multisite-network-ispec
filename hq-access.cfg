! HQ-Access (IOSv-L2) - Layer 2 access switch
! Gi0/0 -> Core1, Gi0/1 -> Core2, Gi1/0.. = end-device ports (adjust to your image)
hostname HQ-Access
no ip domain-lookup
service password-encryption
enable secret Str0ng-Enable!
!
vlan 10
 name FINANCE
vlan 20
 name IT
vlan 30
 name SALES
vlan 40
 name GUEST
vlan 99
 name MGMT
vlan 999
 name NATIVE-UNUSED
!
spanning-tree mode rapid-pvst
spanning-tree portfast bpduguard default
!
interface range GigabitEthernet0/0 - 1
 description Uplinks to Core1/Core2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,99
!
! Example access ports - one host per VLAN for testing
interface GigabitEthernet1/0
 description Finance host
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
interface GigabitEthernet1/1
 description IT host
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
interface GigabitEthernet1/2
 description Sales host
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
interface GigabitEthernet1/3
 description Guest host
 switchport mode access
 switchport access vlan 40
 spanning-tree portfast
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
!
interface Vlan99
 description MGMT
 ip address 10.0.99.10 255.255.255.0
 no shutdown
ip default-gateway 10.0.99.1
!
access-list 10 permit 10.0.99.0 0.0.0.255
username admin secret Str0ng-Admin!
line vty 0 4
 access-class 10 in
 login local
 transport input ssh
end
