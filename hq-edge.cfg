! HQ-Edge - VPN hub, OSPF ABR. Gi0/0=ISP, Gi0/1=Core1, Gi0/2=Core2
hostname HQ-Edge
no ip domain-lookup
service password-encryption
enable secret Str0ng-Enable!
!
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
!
interface GigabitEthernet0/0
 description To ISP
 ip address 203.0.113.2 255.255.255.252
 no shutdown
interface GigabitEthernet0/1
 description To HQ-Core1
 ip address 10.255.0.1 255.255.255.252
 ip ospf network point-to-point
 no shutdown
interface GigabitEthernet0/2
 description To HQ-Core2
 ip address 10.255.0.5 255.255.255.252
 ip ospf network point-to-point
 no shutdown
!
! ---------- IPsec (Phase 1 / Phase 2) ----------
crypto isakmp policy 10
 encryption aes 256
 hash sha256
 authentication pre-share
 group 14
 lifetime 86400
crypto isakmp key VPN-Key-BR1 address 198.51.100.2
crypto isakmp key VPN-Key-BR2 address 198.51.100.6
crypto isakmp key VPN-Key-BR3 address 198.51.100.10
!
crypto ipsec transform-set TS-AES256 esp-aes 256 esp-sha256-hmac
 mode transport
!
crypto ipsec profile GRE-PROF-BR1
 set transform-set TS-AES256
crypto ipsec profile GRE-PROF-BR2
 set transform-set TS-AES256
crypto ipsec profile GRE-PROF-BR3
 set transform-set TS-AES256
!
! NOTE: with per-peer keys each tunnel is matched by its peer address.
! ---------- GRE tunnels protected by IPsec ----------
interface Tunnel1
 description VPN to BR1
 ip address 172.16.1.1 255.255.255.252
 tunnel source GigabitEthernet0/0
 tunnel destination 198.51.100.2
 tunnel protection ipsec profile GRE-PROF-BR1
 ip ospf network point-to-point
interface Tunnel2
 description VPN to BR2
 ip address 172.16.2.1 255.255.255.252
 tunnel source GigabitEthernet0/0
 tunnel destination 198.51.100.6
 tunnel protection ipsec profile GRE-PROF-BR2
 ip ospf network point-to-point
interface Tunnel3
 description VPN to BR3
 ip address 172.16.3.1 255.255.255.252
 tunnel source GigabitEthernet0/0
 tunnel destination 198.51.100.10
 tunnel protection ipsec profile GRE-PROF-BR3
 ip ospf network point-to-point
!
! ---------- OSPF multi-area (this router is the ABR) ----------
router ospf 1
 router-id 1.1.1.1
 network 1.1.1.1 0.0.0.0 area 0
 network 10.255.0.0 0.0.0.3 area 0
 network 10.255.0.4 0.0.0.3 area 0
 network 172.16.1.0 0.0.0.3 area 1
 network 172.16.2.0 0.0.0.3 area 2
 network 172.16.3.0 0.0.0.3 area 3
 passive-interface GigabitEthernet0/0
!
ip route 0.0.0.0 0.0.0.0 203.0.113.1
!
! ---------- Management hardening ----------
access-list 10 permit 10.0.99.0 0.0.0.255
line vty 0 4
 access-class 10 in
 login local
 transport input ssh
username admin secret Str0ng-Admin!
end
